name: VoiceGuard AI — Consolidated CI

on:
  push:
    branches: [main, develop]
    paths:
      - "voiceguard-ai/backend/**"
      - "voiceguard-ai/frontend/**"
      - "voiceguard-ai/ai-engine/**"
      - "voiceguard-ai/docker-compose*.yml"
      - "voiceguard-ai/Dockerfile*"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "voiceguard-ai/backend/**"
      - "voiceguard-ai/frontend/**"
      - "voiceguard-ai/ai-engine/**"
      - "voiceguard-ai/docker-compose*.yml"
      - "voiceguard-ai/Dockerfile*"
  workflow_dispatch:
    inputs:
      skip_cache:
        description: "Skip pip/npm caches"
        required: false
        default: "false"
        type: boolean

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

# ─────────────────────────────────────────────────────────────────────────────
# PERMISSIONS
# ─────────────────────────────────────────────────────────────────────────────
permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  # ───────────────────────────────────────────────
  # JOB 0 — Validate required repo structure
  # ───────────────────────────────────────────────
  validate-repo:
    name: Validate — Repository Structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required files exist
        run: |
          set -e
          required_files=(
            "voiceguard-ai/backend/requirements.txt"
            "voiceguard-ai/backend/app/main.py"
            "voiceguard-ai/frontend/package.json"
            "voiceguard-ai/frontend/package-lock.json"
            "voiceguard-ai/Dockerfile.backend"
            "voiceguard-ai/Dockerfile.frontend"
            "voiceguard-ai/docker-compose.yml"
            "voiceguard-ai/docker-compose.prod.yml"
          )
          missing=0
          for f in "${required_files[@]}"; do
            if [ ! -f "$f" ]; then
              echo "::error file=$f::Required file missing: $f"
              missing=$((missing + 1))
            else
              echo "  ✓ $f"
            fi
          done
          if [ "$missing" -gt 0 ]; then
            echo "::error::$missing required file(s) missing."
            exit 1
          fi
          echo "All required files present."

  # ───────────────────────────────────────────────
  # JOB 1 — Backend Lint (ruff)
  # ───────────────────────────────────────────────
  lint-backend:
    name: Lint — Backend (ruff)
    runs-on: ubuntu-latest
    needs: [validate-repo]
    defaults:
      run:
        working-directory: voiceguard-ai/backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: ${{ inputs.skip_cache == 'true' && '' || 'pip' }}

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff check
        run: ruff check app/ --output-format=github

      - name: Run ruff format check
        run: ruff format app/ --check --diff
        continue-on-error: true  # Format violations are warnings only

  # ───────────────────────────────────────────────
  # JOB 2 — Frontend Lint (oxlint + tsc)
  # ───────────────────────────────────────────────
  lint-frontend:
    name: Lint — Frontend (oxlint + tsc)
    runs-on: ubuntu-latest
    needs: [validate-repo]
    defaults:
      run:
        working-directory: voiceguard-ai/frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: voiceguard-ai/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run oxlint
        # oxlint exits 0 on warnings — only errors fail pipeline
        run: npm run lint
        continue-on-error: false

      - name: TypeScript type-check
        run: npx tsc --noEmit

  # ───────────────────────────────────────────────
  # JOB 3 — Backend Tests (pytest + Redis service)
  # ───────────────────────────────────────────────
  test-backend:
    name: Test — Backend (pytest)
    runs-on: ubuntu-latest
    needs: [lint-backend]
    defaults:
      run:
        working-directory: voiceguard-ai/backend

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: sqlite+aiosqlite:///./test_ci.db
      REDIS_URL: redis://localhost:6379/1
      SECRET_KEY: ci-test-secret-key-at-least-32-chars-long-xK9p
      ENVIRONMENT: test
      LOG_LEVEL: ERROR
      PYTHONPATH: ${{ github.workspace }}/voiceguard-ai/backend:${{ github.workspace }}/voiceguard-ai/ai-engine
      TESTING: "true"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: voiceguard-ai/backend/requirements.txt

      - name: Install system dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y libsndfile1 ffmpeg

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run pytest
        run: |
          python -m pytest tests/ \
            -v \
            --tb=short \
            --junitxml=test-results.xml \
            -p no:warnings \
            --ignore=tests/test_integration_layer.py

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results-${{ github.run_id }}
          path: voiceguard-ai/backend/test-results.xml
          retention-days: 30

  # ───────────────────────────────────────────────
  # JOB 4 — Alembic Migration Validation
  # ───────────────────────────────────────────────
  migrate-validate:
    name: Validate — Alembic Migrations
    runs-on: ubuntu-latest
    needs: [lint-backend]
    defaults:
      run:
        working-directory: voiceguard-ai/backend

    env:
      DATABASE_URL: sqlite+aiosqlite:///./test_migrations.db
      PYTHONPATH: ${{ github.workspace }}/voiceguard-ai/backend:${{ github.workspace }}/voiceguard-ai/ai-engine

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: voiceguard-ai/backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run alembic upgrade head
        run: alembic upgrade head

      - name: Verify alembic current
        run: alembic current

      - name: Check for pending migrations
        run: |
          pending=$(alembic check 2>&1 || true)
          echo "$pending"
          if echo "$pending" | grep -q "Target database is not up to date"; then
            echo "::warning::Pending migrations detected. Run alembic upgrade head."
          fi

  # ───────────────────────────────────────────────
  # JOB 5 — Frontend Build (Vite)
  # ───────────────────────────────────────────────
  build-frontend:
    name: Build — Frontend (Vite)
    runs-on: ubuntu-latest
    needs: [lint-frontend]
    defaults:
      run:
        working-directory: voiceguard-ai/frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: voiceguard-ai/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build production bundle
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Verify dist output
        run: |
          if [ ! -d "dist" ] || [ -z "$(ls -A dist)" ]; then
            echo "::error::Frontend dist/ directory is empty or missing."
            exit 1
          fi
          echo "dist/ contents:"
          ls -lh dist/

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-${{ github.run_id }}
          path: voiceguard-ai/frontend/dist/
          retention-days: 7

  # ───────────────────────────────────────────────
  # JOB 6 — CI Summary Gate
  # ───────────────────────────────────────────────
  ci-gate:
    name: CI — Gate (all checks passed)
    runs-on: ubuntu-latest
    needs: [test-backend, migrate-validate, build-frontend]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          echo "test-backend:    ${{ needs.test-backend.result }}"
          echo "migrate-validate: ${{ needs.migrate-validate.result }}"
          echo "build-frontend:  ${{ needs.build-frontend.result }}"

          if [ "${{ needs.test-backend.result }}" != "success" ]; then
            echo "::error::Backend tests failed."
            exit 1
          fi
          if [ "${{ needs.migrate-validate.result }}" != "success" ]; then
            echo "::error::Alembic migration validation failed."
            exit 1
          fi
          if [ "${{ needs.build-frontend.result }}" != "success" ]; then
            echo "::error::Frontend build failed."
            exit 1
          fi
          echo "✅ All CI checks passed."

