# =============================================================================
# VoiceGuard AI — Production Docker Compose Override
# Phase 30: Dockerization (SIH26104)
# Usage: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# =============================================================================

services:
  db:
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-voiceguard}
      POSTGRES_USER: ${DB_USER:-voiceguard}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required in production}
    # Security: Database completely isolated from host (no port exposure)
    ports: []
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  redis:
    restart: always
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required in production}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 60 1000
      --appendonly yes
    # Security: Redis completely isolated from host (no port exposure)
    ports: []
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  backend:
    restart: always
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg2://${DB_USER:-voiceguard}:${DB_PASSWORD}@db:5432/${DB_NAME:-voiceguard}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required in production}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      ENFORCE_HTTPS: "true"
      LOG_LEVEL: WARNING
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://voiceguard.example.com}
      MODEL_CACHE_DIR: /app/models
    deploy:
      replicas: ${BACKEND_REPLICAS:-2}
      resources:
        limits:
          cpus: "2.0"
          memory: 4G
        reservations:
          cpus: "0.5"
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  frontend:
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  nginx:
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/voiceguard.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - nginx_logs:/var/log/nginx
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"
