# =============================================================================
# VoiceGuard AI — PostgreSQL Production Configuration
# Phase 32: Production Infrastructure
#
# Tuned for a 4-core, 8GB RAM server running PostgreSQL 16.
# Adjust based on actual server resources.
# =============================================================================

# ── Connection Settings ───────────────────────────────────────────────────────
# Max connections: 100 (use pgBouncer for higher concurrency)
max_connections = 100
superuser_reserved_connections = 3

# ── Memory Settings ───────────────────────────────────────────────────────────
# shared_buffers = 25% of RAM (8GB server → 2GB)
shared_buffers = 2GB

# effective_cache_size = 75% of RAM (8GB → 6GB)
effective_cache_size = 6GB

# work_mem: Per-operation sort/hash memory
# Formula: (RAM - shared_buffers) / max_connections / 2
# (8GB - 2GB) / 100 / 2 = ~30MB
work_mem = 32MB

# maintenance_work_mem: Index builds, VACUUM
maintenance_work_mem = 512MB

# ── Write Performance ─────────────────────────────────────────────────────────
wal_buffers = 64MB
checkpoint_completion_target = 0.9
max_wal_size = 2GB
min_wal_size = 512MB

# ── Planner Settings ──────────────────────────────────────────────────────────
# random_page_cost = 1.1 for SSD, 4 for HDD
random_page_cost = 1.1
effective_io_concurrency = 200

# ── Logging (security-aware) ──────────────────────────────────────────────────
log_destination = 'stderr'
logging_collector = off     # Docker captures stderr
log_min_duration_statement = 500   # Log slow queries > 500ms
log_checkpoints = on
log_lock_waits = on
log_timezone = 'UTC'
log_line_prefix = '%t [%p] %u@%d '

# ── Security ──────────────────────────────────────────────────────────────────
ssl = off            # TLS terminated at Nginx; internal traffic is plaintext within Docker
password_encryption = scram-sha-256

# ── Autovacuum ────────────────────────────────────────────────────────────────
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 1min

# ── Statistics ────────────────────────────────────────────────────────────────
track_activities = on
track_counts = on
track_io_timing = on

