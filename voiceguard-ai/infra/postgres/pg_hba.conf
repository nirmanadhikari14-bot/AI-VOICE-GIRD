# =============================================================================
# VoiceGuard AI — PostgreSQL Host-Based Authentication
# Phase 32: Production Infrastructure
#
# TYPE  DATABASE   USER        ADDRESS         METHOD
# =============================================================================

# Allow local Unix socket connections (pg_isready, cron jobs)
local   all        all                         trust

# Allow IPv4 connections from Docker internal networks only
# Docker bridge network is typically 172.16.0.0/12
host    all        all         127.0.0.1/32    scram-sha-256
host    all        all         172.16.0.0/12   scram-sha-256
host    all        all         10.0.0.0/8      scram-sha-256

# DENY all other connections
# (Docker isolates the data-network, but this adds defense-in-depth)
host    all        all         0.0.0.0/0       reject

