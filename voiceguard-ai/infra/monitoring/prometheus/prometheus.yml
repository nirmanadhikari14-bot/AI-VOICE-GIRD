# =============================================================================
# VoiceGuard AI — Prometheus Configuration
# Phase 32: Production Infrastructure
# =============================================================================

global:
  scrape_interval:     15s
  evaluation_interval: 15s
  external_labels:
    environment: "production"
    project: "voiceguard-ai"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - "/etc/prometheus/rules/*.yml"

scrape_configs:

  # ── Prometheus self-monitoring ───────────────────────────────────────────
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # ── Node Exporter (host OS metrics) ─────────────────────────────────────
  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: "node_.*"
        action: keep

  # ── Backend application metrics ──────────────────────────────────────────
  - job_name: "voiceguard-backend"
    metrics_path: "/api/v1/metrics"
    scrape_interval: 10s
    static_configs:
      - targets: ["backend:8000"]
        labels:
          service: "backend"
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance

  # ── Nginx (nginx-prometheus-exporter or stub_status) ────────────────────
  - job_name: "nginx"
    metrics_path: "/stub_status"
    static_configs:
      - targets: ["nginx:80"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: "nginx"

  # ── PostgreSQL ───────────────────────────────────────────────────────────
  - job_name: "postgresql"
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels:
          service: "postgresql"

  # ── Redis ────────────────────────────────────────────────────────────────
  - job_name: "redis"
    static_configs:
      - targets: ["redis-exporter:9121"]
        labels:
          service: "redis"

