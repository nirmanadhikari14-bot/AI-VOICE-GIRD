# =============================================================================
# VoiceGuard AI — Nginx Virtual Host: Main Application (HTTPS)
# Phase 32: Production Infrastructure
#
# Replace DOMAIN_PLACEHOLDER with your actual domain before deploy.
# =============================================================================

# SSL parameters (shared across vhosts)
ssl_protocols             TLSv1.2 TLSv1.3;
ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
ssl_prefer_server_ciphers off;
ssl_session_cache         shared:SSL:10m;
ssl_session_timeout       1d;
ssl_session_tickets       off;
ssl_stapling              on;
ssl_stapling_verify       on;
resolver                  1.1.1.1 8.8.8.8 valid=300s;
resolver_timeout          5s;

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name DOMAIN_PLACEHOLDER www.DOMAIN_PLACEHOLDER;

    ssl_certificate     /etc/letsencrypt/live/DOMAIN_PLACEHOLDER/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMAIN_PLACEHOLDER/privkey.pem;

    # ── Security Headers ─────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "microphone=(self), camera=(), geolocation=()" always;
    add_header Content-Security-Policy
        "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' wss://DOMAIN_PLACEHOLDER ws://DOMAIN_PLACEHOLDER; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';"
        always;
    add_header X-Request-ID $request_id always;

    # ── Static Frontend Assets ───────────────────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|map|wasm)$ {
        proxy_pass         http://voiceguard_frontend;
        proxy_cache_valid  200 1y;
        add_header         Cache-Control "public, immutable, max-age=31536000";
        add_header         Vary "Accept-Encoding";
        expires            1y;
        proxy_hide_header  X-Powered-By;
    }

    # ── Health check (no auth, no rate limit) ────────────────────────────────
    location = /health {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # ── Auth endpoints (strict rate limit) ───────────────────────────────────
    location /api/v1/auth/ {
        limit_req zone=auth_zone burst=5 nodelay;
        limit_conn conn_zone 5;

        proxy_pass         http://voiceguard_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Request-ID      $request_id;
        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
    }

    # ── Audio upload (size + rate controlled) ────────────────────────────────
    location /api/v1/audio/ {
        limit_req zone=upload_zone burst=4 nodelay;
        client_max_body_size 32m;
        client_body_timeout  120s;

        proxy_pass         http://voiceguard_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Request-ID      $request_id;
        proxy_connect_timeout 10s;
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;
    }

    # ── General API ──────────────────────────────────────────────────────────
    location /api/ {
        limit_req zone=api_zone burst=50 nodelay;
        limit_conn conn_zone 20;

        proxy_pass         http://voiceguard_backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Request-ID      $request_id;
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }

    # ── OpenAPI docs (IP-restricted in production) ───────────────────────────
    location /docs {
        # Restrict to internal/admin IPs — update with your actual admin IPs
        # allow 10.0.0.0/8;
        # allow 172.16.0.0/12;
        # deny all;
        proxy_pass http://voiceguard_backend/docs;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://voiceguard_backend/openapi.json;
        proxy_set_header Host $host;
    }

    # ── WebSocket (audio streaming) ───────────────────────────────────────────
    location /ws/ {
        limit_req zone=ws_zone burst=20;

        proxy_pass          http://voiceguard_backend;
        proxy_http_version  1.1;
        proxy_set_header    Upgrade    $http_upgrade;
        proxy_set_header    Connection "upgrade";
        proxy_set_header    Host       $host;
        proxy_set_header    X-Real-IP  $remote_addr;
        proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_connect_timeout 10s;

        # WebSocket keepalive
        proxy_socket_keepalive on;
    }

    # ── SPA fallback (React Router) ──────────────────────────────────────────
    location / {
        proxy_pass         http://voiceguard_frontend;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_intercept_errors on;
        error_page 404 = /index.html;
    }

    # ── Block hidden files ────────────────────────────────────────────────────
    location ~ /\. {
        deny all;
        return 404;
    }

    # ── Block common exploit paths ─────────────────────────────────────────────
    location ~* (\.php|\.asp|\.env|\.git|wp-admin|xmlrpc\.php) {
        deny all;
        return 404;
    }
}

# ── Monitoring subdomain (Grafana) ────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name monitoring.DOMAIN_PLACEHOLDER;

    ssl_certificate     /etc/letsencrypt/live/DOMAIN_PLACEHOLDER/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMAIN_PLACEHOLDER/privkey.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # ── Restrict to admin IPs only ──────────────────────────────────────────
    # Uncomment and update with your admin IP/range:
    # allow 203.0.113.10;
    # deny all;

    location / {
        proxy_pass         http://grafana:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Grafana WebSocket (live dashboards)
    location /api/live/ {
        proxy_pass         http://grafana:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
    }
}

