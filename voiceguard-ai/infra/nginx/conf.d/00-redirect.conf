# =============================================================================
# VoiceGuard AI — Nginx Virtual Host: HTTP → HTTPS Redirect
# Phase 32: Production Infrastructure
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Let's Encrypt ACME challenge path (must be accessible over HTTP)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

