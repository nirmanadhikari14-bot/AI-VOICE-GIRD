# =============================================================================
# VoiceGuard AI — Nginx Production Configuration
# Phase 32: Production Infrastructure (SIH26104)
#
# Features:
#   - HTTP → HTTPS redirect
#   - TLS 1.2/1.3 only (via Let's Encrypt)
#   - Full security headers (CSP, HSTS, etc.)
#   - Rate limiting (API: 30r/s, auth: 5r/m, upload: 2r/s)
#   - WebSocket proxy for audio streaming
#   - Grafana monitoring reverse proxy
#   - gzip compression
#   - Request size limits
#   - Non-root access restrictions
# =============================================================================

user  nginx;
worker_processes  auto;
worker_rlimit_nofile  65535;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
    multi_accept        on;
    use                 epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ──────────────────────────────────────────────────────────────
    log_format  main_json  escape=json
        '{"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"request":"$request",'
        '"status":"$status",'
        '"bytes_sent":"$bytes_sent",'
        '"request_time":"$request_time",'
        '"upstream_response_time":"$upstream_response_time",'
        '"http_x_forwarded_for":"$http_x_forwarded_for",'
        '"http_user_agent":"$http_user_agent",'
        '"http_referer":"$http_referer"}';

    access_log  /var/log/nginx/access.log  main_json;

    # ── Security — hide server version ───────────────────────────────────────
    server_tokens off;

    # ── Performance ───────────────────────────────────────────────────────────
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    keepalive_requests 1000;
    types_hash_max_size 2048;
    server_tokens      off;  # Hide nginx version

    # ── Upload limits ─────────────────────────────────────────────────────────
    client_max_body_size    ${CLIENT_MAX_BODY_SIZE:-32m};
    client_body_timeout     60s;
    client_header_timeout   30s;
    send_timeout            60s;

    # ── Buffer tuning ─────────────────────────────────────────────────────────
    client_body_buffer_size     128k;
    proxy_buffer_size           16k;
    proxy_buffers               4 32k;
    proxy_busy_buffers_size     64k;

    # ── Gzip ─────────────────────────────────────────────────────────────────
    gzip               on;
    gzip_vary          on;
    gzip_proxied       any;
    gzip_comp_level    6;
    gzip_min_length    1000;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml+rss
        application/atom+xml image/svg+xml
        application/wasm;

    # ── Rate Limiting Zones ───────────────────────────────────────────────────
    # General API: 30 requests/second per IP
    limit_req_zone $binary_remote_addr zone=api_zone:20m     rate=30r/s;
    # Auth endpoints: 5 requests/minute per IP (brute-force protection)
    limit_req_zone $binary_remote_addr zone=auth_zone:10m    rate=5r/m;
    # Audio upload: 2 requests/second per IP
    limit_req_zone $binary_remote_addr zone=upload_zone:10m  rate=2r/s;
    # WebSocket connections: 10/second per IP
    limit_req_zone $binary_remote_addr zone=ws_zone:10m      rate=10r/s;

    limit_req_status 429;
    limit_conn_zone $binary_remote_addr zone=conn_zone:10m;

    # ── Backend upstream ──────────────────────────────────────────────────────
    upstream voiceguard_backend {
        least_conn;
        server backend:8000 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream voiceguard_frontend {
        server frontend:80;
        keepalive 16;
    }

    # ── Include virtual hosts ─────────────────────────────────────────────────
    include /etc/nginx/conf.d/*.conf;
}
