# =============================================================================
# VoiceGuard AI — Production Docker Compose (Full Stack with Monitoring)
# Phase 32: Production Infrastructure (SIH26104)
#
# Usage (single-server deployment):
#   cp .env.production .env
#   docker compose -f docker-compose.yml \
#                  -f docker-compose.prod.yml \
#                  -f docker-compose.monitoring.yml up -d
#
# IMPORTANT: PostgreSQL and Redis are on data-network (internal: true).
#            They are NEVER reachable from outside the host.
# =============================================================================

name: voiceguard-prod

services:

  # ── PostgreSQL 16 ─────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:?DB_NAME required}
      POSTGRES_USER: ${DB_USER:?DB_USER required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD required}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./infra/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
      - postgres_backup:/var/lib/postgresql/backups
    networks:
      - data-network
    ports: []  # NEVER expose to host
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M

  # ── Redis 7 ───────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: always
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD required}
      --maxmemory ${REDIS_MAXMEMORY:-512mb}
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --save 60 10000
      --appendonly yes
      --appendfsync everysec
      --loglevel warning
      --bind 0.0.0.0
      --protected-mode yes
    volumes:
      - redis_data:/data
    networks:
      - data-network
    ports: []  # NEVER expose to host
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
        reservations:
          cpus: "0.1"
          memory: 128M

  # ── Backend API (2 replicas via Compose scale) ────────────────────────────
  backend:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE required}
    restart: always
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg2://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY required}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      ENFORCE_HTTPS: "true"
      LOG_LEVEL: ${LOG_LEVEL:-WARNING}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?ALLOWED_ORIGINS required}
      MODEL_CACHE_DIR: /app/models
      AUDIO_STORAGE_PATH: /app/storage/audio
      TEMP_STORAGE_PATH: /app/storage/temp
      # Uvicorn workers
      UVICORN_WORKERS: ${UVICORN_WORKERS:-2}
      UVICORN_WORKER_CLASS: uvicorn.workers.UvicornWorker
      # Phase 28 performance tuning
      CACHE_MAX_SIZE: ${CACHE_MAX_SIZE:-5000}
      CACHE_DEFAULT_TTL: ${CACHE_DEFAULT_TTL:-300}
      INFERENCE_POOL_SIZE: ${INFERENCE_POOL_SIZE:-4}
      RING_BUFFER_CAPACITY_SECONDS: ${RING_BUFFER_CAPACITY_SECONDS:-10}
      # Telemetry
      OTEL_SERVICE_NAME: voiceguard-backend
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_ENDPOINT:-http://otel-collector:4318}
    volumes:
      - model_cache:/app/models:ro
      - audio_storage:/app/storage/audio
      - temp_storage:/app/storage/temp
    networks:
      - backend-network
      - data-network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 25s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    deploy:
      replicas: ${BACKEND_REPLICAS:-2}
      resources:
        limits:
          cpus: "2.0"
          memory: 4G
        reservations:
          cpus: "0.5"
          memory: 1G
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        monitor: 30s
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3

  # ── Frontend (nginx serving React SPA) ───────────────────────────────────
  frontend:
    image: ${FRONTEND_IMAGE:?FRONTEND_IMAGE required}
    restart: always
    networks:
      - frontend-network
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.05"
          memory: 64M

  # ── Nginx Reverse Proxy + TLS Terminator ─────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./infra/certbot/conf:/etc/letsencrypt:ro
      - ./infra/certbot/www:/var/www/certbot:ro
      - nginx_logs:/var/log/nginx
      - nginx_cache:/var/cache/nginx
    networks:
      - frontend-network
      - backend-network
    depends_on:
      - backend
      - frontend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M

  # ── Certbot (Let's Encrypt TLS) ───────────────────────────────────────────
  certbot:
    image: certbot/certbot:latest
    restart: "no"  # Run on demand; renew via cron
    volumes:
      - ./infra/certbot/conf:/etc/letsencrypt
      - ./infra/certbot/www:/var/www/certbot
    command: >
      certonly
      --webroot
      --webroot-path=/var/www/certbot
      --email ${ACME_EMAIL:?ACME_EMAIL required}
      --agree-tos
      --no-eff-email
      --domains ${DOMAIN:?DOMAIN required}
      --domains www.${DOMAIN}
      --domains api.${DOMAIN}

  # ── Database Backup Sidecar ───────────────────────────────────────────────
  db-backup:
    image: postgres:16-alpine
    restart: "no"
    environment:
      PGPASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
    volumes:
      - postgres_backup:/backups
      - ./infra/scripts/db_backup.sh:/db_backup.sh:ro
    networks:
      - data-network
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["sh", "/db_backup.sh"]
    profiles:
      - backup  # Only started explicitly: docker compose --profile backup run db-backup

  # ── Prometheus ────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.47.2
    restart: always
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}"
      - "--web.enable-lifecycle"
      - "--web.enable-admin-api"
      - "--web.listen-address=:9090"
    volumes:
      - ./infra/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    networks:
      - monitoring-network
      - backend-network
    ports: []  # Only accessible within monitoring network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  # ── Grafana ───────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.2.0
    restart: always
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD required}
      GF_SECURITY_SECRET_KEY: ${GRAFANA_SECRET_KEY:?GRAFANA_SECRET_KEY required}
      GF_SERVER_ROOT_URL: https://monitoring.${DOMAIN:-voiceguard.example.com}
      GF_SERVER_DOMAIN: monitoring.${DOMAIN:-voiceguard.example.com}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_ALLOW_ORG_CREATE: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SMTP_ENABLED: ${GF_SMTP_ENABLED:-false}
      GF_SMTP_HOST: ${SMTP_HOST:-}
      GF_SMTP_USER: ${SMTP_USER:-}
      GF_SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      GF_SMTP_FROM_ADDRESS: ${SMTP_FROM:-}
      GF_INSTALL_PLUGINS: grafana-clock-panel,grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./infra/monitoring/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
    networks:
      - monitoring-network
      - frontend-network  # Exposed via Nginx at /grafana or monitoring subdomain
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  # ── Alertmanager ──────────────────────────────────────────────────────────
  alertmanager:
    image: prom/alertmanager:v0.26.0
    restart: always
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    volumes:
      - ./infra/monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    networks:
      - monitoring-network
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 128M

  # ── Node Exporter (host metrics) ──────────────────────────────────────────
  node-exporter:
    image: prom/node-exporter:v1.7.0
    restart: always
    command:
      - "--path.rootfs=/host"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host:ro,rslave
    network_mode: host  # Required for node_exporter to see host network stats
    pid: host
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: 64M

  # ── Postgres Exporter (DB metrics) ───────────────────────────────────────
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    restart: always
    environment:
      DATA_SOURCE_NAME: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}?sslmode=disable
      PG_EXPORTER_AUTO_DISCOVER_DATABASES: "true"
    networks:
      - data-network
      - monitoring-network
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: 64M

  # ── Redis Exporter (Redis metrics) ────────────────────────────────────────
  redis-exporter:
    image: oliver006/redis_exporter:v1.56.0
    restart: always
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks:
      - data-network
      - monitoring-network
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: 32M

# ── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${POSTGRES_DATA_PATH:-/opt/voiceguard/data/postgres}
  postgres_backup:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${POSTGRES_BACKUP_PATH:-/opt/voiceguard/backups/postgres}
  redis_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${REDIS_DATA_PATH:-/opt/voiceguard/data/redis}
  model_cache:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${MODEL_CACHE_PATH:-/opt/voiceguard/models}
  audio_storage:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${AUDIO_STORAGE_PATH:-/opt/voiceguard/audio}
  temp_storage:
    driver: local
  nginx_logs:
    driver: local
  nginx_cache:
    driver: local
  prometheus_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PROMETHEUS_DATA_PATH:-/opt/voiceguard/data/prometheus}
  grafana_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${GRAFANA_DATA_PATH:-/opt/voiceguard/data/grafana}
  alertmanager_data:
    driver: local

# ── Networks ──────────────────────────────────────────────────────────────────
networks:
  frontend-network:
    name: voiceguard_frontend_net
    driver: bridge
  backend-network:
    name: voiceguard_backend_net
    driver: bridge
  data-network:
    name: voiceguard_data_net
    driver: bridge
    internal: true  # PostgreSQL and Redis UNREACHABLE from outside
  monitoring-network:
    name: voiceguard_monitoring_net
    driver: bridge
    internal: true  # Prometheus/Alertmanager not publicly routable

