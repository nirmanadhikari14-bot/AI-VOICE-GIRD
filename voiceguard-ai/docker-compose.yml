# =============================================================================
# VoiceGuard AI — Base Docker Compose Architecture
# Phase 30: Dockerization (SIH26104)
# =============================================================================

name: voiceguard-ai

services:
  # ── PostgreSQL Database ──────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-voiceguard}
      POSTGRES_USER: ${DB_USER:-voiceguard_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-voiceguard_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - data-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-voiceguard_user} -d ${DB_NAME:-voiceguard}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Redis Cache, Session Store & Pub/Sub ─────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-voiceguard_redis_pass}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 60 1000
      --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - data-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-voiceguard_redis_pass}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ── Backend Application & AI Inference Orchestrator ─────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: postgresql+psycopg2://${DB_USER:-voiceguard_user}:${DB_PASSWORD:-voiceguard_dev_password}@db:5432/${DB_NAME:-voiceguard}
      REDIS_URL: redis://:${REDIS_PASSWORD:-voiceguard_redis_pass}@redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-dev_secret_key_change_in_production_32chars}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:80,http://frontend}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MODEL_CACHE_DIR: /app/models
      AUDIO_STORAGE_PATH: /app/storage/audio
      TEMP_STORAGE_PATH: /app/storage/temp
    volumes:
      - model_cache:/app/models
      - audio_storage:/app/storage/audio
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend-network
      - data-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 25s

  # ── Frontend Web Dashboard & Enterprise Admin Portal ─────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - frontend-network

  # ── Nginx Edge Reverse Proxy & TLS Terminator ───────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/voiceguard.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - backend
      - frontend
    networks:
      - frontend-network
      - backend-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3

# ── Persistent Storage Volumes ────────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  model_cache:
    driver: local
  audio_storage:
    driver: local
  nginx_logs:
    driver: local

# ── Segmented Internal Networks (Least Privilege) ────────────────────────────
networks:
  frontend-network:
    name: voiceguard_frontend_net
    driver: bridge
  backend-network:
    name: voiceguard_backend_net
    driver: bridge
  data-network:
    name: voiceguard_data_net
    driver: bridge
    internal: true  # Completely isolates PostgreSQL & Redis from outside traffic
